<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>رحلتي</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <header class="header">
      <h1>🧳 رحلتي</h1>
      <button id="themeBtn" class="ghost" type="button">🌙</button>
    </header>

    <form id="tripForm">
      <input id="tripName" placeholder="اسم الرحلة" />
      <input id="tripDest" placeholder="الوجهة (مثال: Istanbul)" />
      <button>إنشاء رحلة</button>
    </form>

    <div id="tripsList"></div>

    <section id="tripView" hidden>
      <div class="top">
        <h2 class="budget">الميزانية الكلية: <b id="budget">0</b>$</h2>
        <button id="addDayBtn" type="button">+ يوم جديد</button>
        <button id="deleteTripBtn" type="button" class="danger">حذف الرحلة</button>
      </div>

      <div id="weather" class="weather"></div>
      <div id="chartBox" class="chart-box" hidden>
      <h3>المصاريف حسب اليوم</h3>
       <div class="chart-wrap">
      <canvas id="expenseChart"></canvas>
        </div>
     </div>
      <div id="days"></div>
    </section>
  </div>
        <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <script src="project.js"></script>
</body>
</html>
